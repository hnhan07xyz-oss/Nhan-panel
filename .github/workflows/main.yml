
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project ZIP
        run: |
          unzip -q huunhan-full-dashboard-api-github.zip -d source

      - name: Find Android project
        run: |
          ANDROID_DIR=$(find source -type f \( -name settings.gradle -o -name settings.gradle.kts \) | grep '/android/android/' | head -n 1 | xargs dirname)
          if [ -z "$ANDROID_DIR" ]; then
            echo "Khong tim thay Android Gradle project!"
            find source -maxdepth 5 -type f | head -100
            exit 1
          fi
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: gradle -p "$ANDROID_DIR" assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HuuNhan-APK
          path: source/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
